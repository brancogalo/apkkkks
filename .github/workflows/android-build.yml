name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Java JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x ${{ github.workspace }}/SMSGateway-Pro/gradlew

    - name: Build APK
      run: cd ${{ github.workspace }}/SMSGateway-Pro && ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: APK
        path: ${{ github.workspace }}/SMSGateway-Pro/app/build/outputs/apk/release/app-release.apk
