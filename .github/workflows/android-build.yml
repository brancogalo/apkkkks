name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin

    - name: Build APK
      working-directory: ./SMSGateway-Pro
      run: |
        gradle wrapper --gradle-version 7.6
        chmod +x gradlew
        ./gradlew clean assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: APK
        path: SMSGateway-Pro/app/build/outputs/apk/release/app-release.apk
